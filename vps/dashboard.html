<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Temperature — RCA</title>
    <script src="mqttws31.min.js">
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
        }
        .card {
            background: linear-gradient(145deg, #111118 0%, #1a1a25 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 56px 64px;
            max-width: 560px;
            width: 92%;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(99, 102, 241, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }
        .header { position: relative; z-index: 1; }
        .badge {
            display: inline-block;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 100px;
            padding: 5px 14px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: #818cf8;
            margin-bottom: 12px;
        }
        .candidate {
            font-size: 11px;
            color: #64748b;
            letter-spacing: 0.3px;
            margin-bottom: 32px;
        }
        .temp-wrap {
            position: relative;
            z-index: 1;
            margin: 8px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .temp-value {
            font-size: 96px;
            font-weight: 800;
            color: #f1f5f9;
            line-height: 1;
            letter-spacing: -2px;
            transition: all 0.3s ease;
        }
        .temp-value .deg {
            font-size: 40px;
            font-weight: 400;
            color: #6366f1;
            vertical-align: super;
            margin-left: 2px;
        }
        .temp-unit {
            font-size: 20px;
            font-weight: 300;
            color: #94a3b8;
            margin-left: 4px;
        }
        .temp-placeholder {
            font-size: 96px;
            font-weight: 800;
            color: #1e293b;
        }
        .meta-row {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 28px;
            flex-wrap: wrap;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #64748b;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .dot.ok { background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,0.3); }
        .dot.err { background: #ef4444; box-shadow: 0 0 10px rgba(239,68,68,0.3); }
        .dot.wait { background: #eab308; box-shadow: 0 0 10px rgba(234,179,8,0.3); animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
        .ts {
            font-size: 11px;
            color: #475569;
            font-family: 'SF Mono', 'Fira Code', monospace;
        }
        .topic {
            position: relative;
            z-index: 1;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.04);
            font-size: 10px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            color: #334155;
            letter-spacing: 0.3px;
        }
        .topic span { color: #6366f1; }
        .error { color: #ef4444; font-size: 12px; margin-top: 8px; display: none; }
        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
            .temp-value { font-size: 64px; }
            .temp-value .deg { font-size: 28px; }
            .temp-placeholder { font-size: 64px; }
        }
    </style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="badge">Live Monitor</div>
        <div class="candidate">KAWACU RUGIRANEZA Arnaud Kennedy</div>
    </div>
    <div class="temp-wrap">
        <div id="tv" class="temp-placeholder">--.-</div>
        <span class="temp-unit" id="tu">°C</span>
    </div>
    <div class="meta-row">
        <div class="status"><span class="dot wait" id="dot"></span><span id="st">Connecting...</span></div>
        <div class="ts" id="lu">—</div>
    </div>
    <div class="error" id="er"></div>
    <div class="topic">topic: <span>rca/year2c/kawacu/temperature</span></div>
</div>

<script>
(function () {
    var host = 'broker.benax.rw', port = 9001, path = '/ws', topic = 'rca/year2c/kawacu/temperature';
    var tv = document.getElementById('tv'), tu = document.getElementById('tu');
    var dot = document.getElementById('dot'), st = document.getElementById('st');
    var lu = document.getElementById('lu'), er = document.getElementById('er');

    function ok() { dot.className = 'dot ok'; }
    function wait() { dot.className = 'dot wait'; }
    function err() { dot.className = 'dot err'; }

    function setError(m) { er.style.display = m ? 'block' : 'none'; er.textContent = m || ''; }

    var cid = 'dash_' + Math.random().toString(36).slice(2, 10);
    var cli = new Paho.MQTT.Client(host, Number(port), path, cid);

    cli.onConnectionLost = function (r) {
        err(); st.textContent = 'Disconnected';
        tu.style.display = 'none';
        tv.className = 'temp-placeholder'; tv.textContent = '--.-';
        setError('Connection lost — reconnecting...');
        setTimeout(function () { cli.connect(opt); }, 5000);
    };

    cli.onMessageArrived = function (m) {
        var v = parseFloat(m.payloadString.trim());
        if (!isNaN(v)) {
            ok(); st.textContent = 'Live';
            tv.className = 'temp-value';
            tv.textContent = v.toFixed(1);
            tu.style.display = '';
            setError('');
            lu.textContent = new Date().toLocaleTimeString();
        }
    };

    var opt = {
        onSuccess: function () {
            ok(); st.textContent = 'Subscribed';
            cli.subscribe(topic);
            setError('');
        },
        onFailure: function (e) {
            err(); st.textContent = 'Failed';
            setError('Could not connect to ' + host);
            setTimeout(function () { cli.connect(opt); }, 5000);
        },
        timeout: 5, keepAliveInterval: 30, cleanSession: true, useSSL: false,
    };

    wait(); st.textContent = 'Connecting...';
    cli.connect(opt);
})();
</script>
</body>
</html>
